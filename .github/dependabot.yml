version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
    ignore:
      # Vitest 5 dropped Node 20, which remains a supported SDK runtime.
      - dependency-name: vitest
        versions: [">=5"]

  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
