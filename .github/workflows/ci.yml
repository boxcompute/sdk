name: Validate SDKs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI and TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:openapi
      - run: npm run generate
      - name: Reject generated TypeScript drift
        run: git diff --exit-code -- packages/typescript/src/generated/schema.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run --workspace @boxcompute/sdk

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e 'packages/python[test]'
      - run: python scripts/generate-python-models.py
      - name: Reject generated Python drift
        run: git diff --exit-code -- packages/python/src/boxcompute/_generated/models.py
      - run: ruff format --check packages/python/src packages/python/tests scripts/generate-python-models.py
      - run: ruff check packages/python
      - run: mypy packages/python/src
      - run: pytest packages/python/tests
      - run: python -m build packages/python
