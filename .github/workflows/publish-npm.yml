name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the TypeScript package version from main to npm
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-typescript-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.package.outputs.name }}
      package-version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:openapi
      - run: npm run generate
      - run: git diff --exit-code -- packages/typescript/src/generated/schema.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Read package version
        id: package
        run: |
          echo "name=$(node --print "require('./packages/typescript/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node --print "require('./packages/typescript/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists on npm" >&2
            exit 1
          fi
      - name: Pack npm package
        run: |
          mkdir -p release
          npm pack --workspace @boxcompute/sdk --pack-destination release
      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-package
          path: release
      - name: Publish npm package
        run: |
          packages=(release/*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          npm publish "${packages[0]}" --access public
      - name: Verify npm release
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          for attempt in $(seq 1 12); do
            published="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"
            if [ "$published" = "$PACKAGE_VERSION" ]; then
              echo "Published $PACKAGE_NAME@$PACKAGE_VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "$PACKAGE_NAME@$PACKAGE_VERSION was not visible after publication" >&2
          exit 1
