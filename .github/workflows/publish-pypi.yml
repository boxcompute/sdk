name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Python package version from main to PyPI
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-python-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e 'packages/python[test]'
      - run: python scripts/generate-python-models.py
      - run: git diff --exit-code -- packages/python/src/boxcompute/_generated/models.py
      - run: ruff format --check packages/python/src packages/python/tests scripts/generate-python-models.py
      - run: ruff check packages/python
      - run: mypy packages/python/src
      - run: pytest packages/python/tests
      - run: python -m build packages/python
      - name: Refuse an existing release
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("packages/python/pyproject.toml", "rb"))["project"]["version"])')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/boxcompute/$version/json")"
          if [ "$status" = "200" ]; then
            echo "boxcompute@$version already exists on PyPI" >&2
            exit 1
          fi
          test "$status" = "404"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: packages/python/dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist
      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          print-hash: true
