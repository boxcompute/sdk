[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boxcompute"
version = "0.1.0"
description = "Official Python SDK for the BoxCompute public API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "BoxCompute"}]
keywords = ["boxcompute", "sandbox", "ai-agent", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "datamodel-code-generator[http]>=0.33,<1",
  "mypy>=1.14,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://boxcompute.ai/docs"
Issues = "https://github.com/boxcompute/sdk/issues"
Repository = "https://github.com/boxcompute/sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boxcompute = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/boxcompute/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["src/boxcompute/_generated/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "boxcompute._generated.*"
follow_imports = "skip"
ignore_errors = true
